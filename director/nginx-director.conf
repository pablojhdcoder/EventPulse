# Director (entrada única): balancea HTTP y WebSockets entre réplicas.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

upstream event_pulse_backends {
    least_conn;
    server web1:4000 max_fails=3 fail_timeout=10s;
    server web2:4000 max_fails=3 fail_timeout=10s;
    server web3:4000 max_fails=3 fail_timeout=10s;
}

server {
    listen 80;
    server_name localhost;

    location / {
        proxy_pass http://event_pulse_backends;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 2s;
        proxy_send_timeout 30s;
        proxy_read_timeout 86400;
        
        proxy_next_upstream error timeout invalid_header http_502 http_503 http_504;
        proxy_next_upstream_tries 3;
    }
}
