# Demo distribuida: PostgreSQL + 3 réplicas EventPulse + Director (nginx).
#
# Levantar stack completo: docker compose up -d --build
#
# Las migraciones se ejecutan una sola vez en el servicio `migrate` (evita carreras
# entre web1/web2/web3). Los seeds se ejecutan en el servicio `seed` (una sola vez
# por `docker compose up`, tras migrar). Opcionalmente en un nodo ya en marcha:
#   docker compose exec web1 bin/event_pulse rpc "EventPulse.Release.seed"
#

x-web-build: &web_build
  context: ./event_pulse

x-app-env: &app_env
  MIX_ENV: prod
  DATABASE_URL: ecto://postgres:postgres@postgres/event_pulse_dev
  REDIS_URL: redis://redis:6379/0
  SECRET_KEY_BASE: "7+SIpOw7JFygjY5b6EmUQVJNJnKRiROC3ioEvYY+YjEreN5TFiIW2NIuHRLdiUfB"
  PHX_HOST: localhost
  DOCKER_DEMO: "true"
  PHX_PUBLIC_HOST: localhost
  PHX_PUBLIC_PORT: "8080"
  POOL_SIZE: "5"

x-web-common: &web_common
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_started
    migrate:
      condition: service_completed_successfully
    seed:
      condition: service_completed_successfully
  healthcheck:
    test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:4000/ || exit 1"]
    interval: 5s
    timeout: 5s
    retries: 12
    start_period: 45s
  environment: &web_env
    <<: *app_env
    PHX_SERVER: "true"
    PORT: "4000"
    RELEASE_COOKIE: event_pulse_demo

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: event_pulse_dev
    ports:
      - "5432:5432"
    volumes:
      - event_pulse_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks: [event_pulse_net]

  migrate:
    hostname: migrate.local
    build:
      <<: *web_build
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    environment:
      <<: *app_env
    entrypoint: ["/bin/sh", "-lc", "exec /app/bin/migrate"]
    restart: "no"
    networks:
      event_pulse_net:
        aliases:
          - migrate.local

  seed:
    hostname: seed.local
    build:
      <<: *web_build
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      migrate:
        condition: service_completed_successfully
    environment:
      <<: *app_env
    entrypoint: ["/bin/sh", "-lc", "exec /app/bin/seed"]
    restart: "no"
    networks:
      event_pulse_net:
        aliases:
          - seed.local

  web1:
    <<: *web_common
    hostname: web1.local
    build:
      <<: *web_build
    environment:
      <<: *web_env
      CLUSTER_PEER_HOSTS: web1.local,web2.local,web3.local
      START_VOTE_AGGREGATOR: "true"
    networks:
      event_pulse_net:
        aliases:
          - web1.local

  web2:
    <<: *web_common
    hostname: web2.local
    build:
      <<: *web_build
    environment:
      <<: *web_env
      CLUSTER_PEER_HOSTS: web1.local,web2.local,web3.local
      START_VOTE_AGGREGATOR: "false"
    networks:
      event_pulse_net:
        aliases:
          - web2.local

  web3:
    <<: *web_common
    hostname: web3.local
    build:
      <<: *web_build
    environment:
      <<: *web_env
      CLUSTER_PEER_HOSTS: web1.local,web2.local,web3.local
      START_VOTE_AGGREGATOR: "false"
    networks:
      event_pulse_net:
        aliases:
          - web3.local

  director:
    image: nginx:alpine
    ports:
      - "8080:80"
    volumes:
      - ./director/nginx-director.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      web1:
        condition: service_healthy
      web2:
        condition: service_healthy
      web3:
        condition: service_healthy
    networks: [event_pulse_net]

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "no"]
    networks: [event_pulse_net]

volumes:
  event_pulse_pg_data:

networks:
  event_pulse_net:
    driver: bridge
